# ==============================================================================
# DZITOE SMAN 20 Kabupaten Tangerang — Full-Stack Compose Configuration
# Production & Coolify Ready (Traefik Proxy Compatible)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 — Database Utama DZITOE
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dzitoe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dzitoe_production_secret_2026}
      POSTGRES_DB: ${DB_NAME:-dzitoe}
      TZ: Asia/Jakarta
    volumes:
      - dzitoe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dzitoe} -d ${DB_NAME:-dzitoe}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dzitoe-network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 — Cache, Rate Limiting & Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dzitoe_redis_secret}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - dzitoe_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dzitoe_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dzitoe-network

  # ----------------------------------------------------------------------------
  # 3. Web Admin DZITOE (Dashboard Port 3000)
  # Di Coolify: Hubungkan domain (misal admin.domain.sch.id) ke port 3000
  # ----------------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-dzitoe}:${DB_PASSWORD:-dzitoe_production_secret_2026}@postgres:5432/${DB_NAME:-dzitoe}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dzitoe_redis_secret}
      JWT_SECRET: ${JWT_SECRET:-dzitoe_jwt_secret_production_2026}
    expose:
      - "3000"
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dzitoe-network

  # ----------------------------------------------------------------------------
  # 4. Mobile PWA DZITOE (Presensi Siswa & Guru Port 3001)
  # Di Coolify: Hubungkan domain (misal app.domain.sch.id) ke port 3001
  # ----------------------------------------------------------------------------
  mobile:
    build:
      context: .
      dockerfile: Dockerfile.mobile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-dzitoe}:${DB_PASSWORD:-dzitoe_production_secret_2026}@postgres:5432/${DB_NAME:-dzitoe}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dzitoe_redis_secret}
      JWT_SECRET: ${JWT_SECRET:-dzitoe_jwt_secret_production_2026}
    expose:
      - "3001"
    ports:
      - "${MOBILE_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dzitoe-network

volumes:
  dzitoe_postgres_data:
  dzitoe_redis_data:

networks:
  dzitoe-network:
    driver: bridge
