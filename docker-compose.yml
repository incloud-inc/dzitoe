# ==============================================================================
# DZITOE SMAN 20 Kabupaten Tangerang — Full-Stack Compose Configuration
# Production & Coolify Ready (Connects to Standalone Coolify DB & Redis)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Hanya untuk Local Development via --profile local)
  # Di Production/Coolify: Otomatis menggunakan Standalone Coolify PostgreSQL
  # ----------------------------------------------------------------------------
  postgres:
    profiles:
      - local
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dzitoe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-GKbqZzlFAjWVxelmleP31LYA6n7kIkv1isoeBJpPrXBwPH7O8zcwjEWNMC6J1xwo}
      POSTGRES_DB: ${DB_NAME:-dzitoe}
      TZ: Asia/Jakarta
    volumes:
      - dzitoe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dzitoe} -d ${DB_NAME:-dzitoe}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Hanya untuk Local Development via --profile local)
  # Di Production/Coolify: Otomatis menggunakan Standalone Coolify Redis
  # ----------------------------------------------------------------------------
  redis:
    profiles:
      - local
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-LgKfmhD75P7DsWPvniZcuXxc0cNaFjdaLF7Y72vpRK8WKYc5gqP9qlaGdKKciQ5w}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - dzitoe_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-LgKfmhD75P7DsWPvniZcuXxc0cNaFjdaLF7Y72vpRK8WKYc5gqP9qlaGdKKciQ5w}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Web Admin DZITOE (Dashboard Port 3000)
  # Di Coolify: Domain dzitoe.web.id terhubung ke port 3000
  # ----------------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://dzitoe:GKbqZzlFAjWVxelmleP31LYA6n7kIkv1isoeBJpPrXBwPH7O8zcwjEWNMC6J1xwo@b2wrapblhuo9sdbw4owuot3w:5432/dzitoe?schema=public}
      REDIS_HOST: ${REDIS_HOST:-lbiore2hrrhbgy9guq0q7tfg}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-LgKfmhD75P7DsWPvniZcuXxc0cNaFjdaLF7Y72vpRK8WKYc5gqP9qlaGdKKciQ5w}
      JWT_SECRET: ${JWT_SECRET:-dzitoe_jwt_secret_production_2026}
    expose:
      - "3000"
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    networks:
      - default
      - coolify

  # ----------------------------------------------------------------------------
  # 4. Mobile PWA DZITOE (Presensi Siswa & Guru Port 3001)
  # Di Coolify: Domain app.dzitoe.web.id terhubung ke port 3001
  # ----------------------------------------------------------------------------
  mobile:
    build:
      context: .
      dockerfile: Dockerfile.mobile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://dzitoe:GKbqZzlFAjWVxelmleP31LYA6n7kIkv1isoeBJpPrXBwPH7O8zcwjEWNMC6J1xwo@b2wrapblhuo9sdbw4owuot3w:5432/dzitoe?schema=public}
      REDIS_HOST: ${REDIS_HOST:-lbiore2hrrhbgy9guq0q7tfg}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-LgKfmhD75P7DsWPvniZcuXxc0cNaFjdaLF7Y72vpRK8WKYc5gqP9qlaGdKKciQ5w}
      JWT_SECRET: ${JWT_SECRET:-dzitoe_jwt_secret_production_2026}
    expose:
      - "3001"
    ports:
      - "${MOBILE_PORT:-3001}:3001"
    networks:
      - default
      - coolify

volumes:
  dzitoe_postgres_data:
  dzitoe_redis_data:

networks:
  coolify:
    name: coolify
    external: true
