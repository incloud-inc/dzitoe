# ==============================================================================
# DZITOE SMAN 20 Kabupaten Tangerang — Infrastructure Services
# Task: A0.8 (Setup Docker Compose)
# Kompatibel: Dev Lokal (Port 5433 / 6380) & Coolify / VPS Ubuntu (Environment dynamic)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 — Database Utama DZITOE
  # Port mapping lokal: 5433 -> 5432 (Mencegah bentrok dengan port 5432 lokal)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dzitoe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dzitoe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dzitoe_dev_password}
      POSTGRES_DB: ${DB_NAME:-dzitoe}
      TZ: Asia/Jakarta
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - dzitoe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dzitoe} -d ${DB_NAME:-dzitoe}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dzitoe-network

  # ----------------------------------------------------------------------------
  # Redis 7 — Cache & Queue (Rate Limiting, Session, Background Jobs)
  # Port mapping lokal: 6380 -> 6379 (Mencegah bentrok dengan port 6379 lokal)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dzitoe-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dzitoe_redis_secret}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - dzitoe_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dzitoe_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dzitoe-network

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy Gateway — Task A0.9
  # Routing traffic ke apps/admin (3000) dan apps/mobile (3001)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: dzitoe-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - postgres
      - redis
    networks:
      - dzitoe-network

volumes:
  dzitoe_postgres_data:
    name: dzitoe_postgres_data
  dzitoe_redis_data:
    name: dzitoe_redis_data

networks:
  dzitoe-network:
    name: dzitoe-network
    driver: bridge
