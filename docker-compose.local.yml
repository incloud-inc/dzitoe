# ==============================================================================
# DZITOE SMAN 20 Kabupaten Tangerang — Infrastructure Services (Dev Lokal)
# Port: PostgreSQL (5433), Redis (6380), Nginx (80/443)
# ==============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dzitoe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dzitoe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dzitoe_dev_password}
      POSTGRES_DB: ${DB_NAME:-dzitoe}
      TZ: Asia/Jakarta
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - dzitoe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dzitoe} -d ${DB_NAME:-dzitoe}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dzitoe-network

  redis:
    image: redis:7-alpine
    container_name: dzitoe-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dzitoe_redis_secret}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - dzitoe_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dzitoe_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dzitoe-network

  nginx:
    image: nginx:alpine
    container_name: dzitoe-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - postgres
      - redis
    networks:
      - dzitoe-network

volumes:
  dzitoe_postgres_data:
    name: dzitoe_postgres_data
  dzitoe_redis_data:
    name: dzitoe_redis_data

networks:
  dzitoe-network:
    name: dzitoe-network
    driver: bridge
