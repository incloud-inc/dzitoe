name: DZITOE CI — Quality & Test Suite

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9.15.4'
  DATABASE_URL: 'postgresql://dzitoe:dzitoe_dev_password@localhost:5432/dzitoe_test?schema=public'
  NEXTAUTH_SECRET: 'ci_testing_super_secret_jwt_key_32_characters_long'

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Static Analysis, Formatting & Type Checking
  # ----------------------------------------------------------------------------
  typecheck-and-lint:
    name: Typecheck & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @dzitoe/db prisma:generate

      - name: Verify Code Formatting (Prettier)
        run: pnpm format:check

      - name: Monorepo Typecheck (TypeScript)
        run: pnpm typecheck

      - name: Lint Analysis (ESLint)
        run: pnpm lint

  # ----------------------------------------------------------------------------
  # Job 2: Automated Unit & Integration Tests (Vitest)
  # ----------------------------------------------------------------------------
  unit-tests:
    name: Unit & Logic Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @dzitoe/db prisma:generate

      - name: Run Vitest Unit Tests
        run: pnpm test

  # ----------------------------------------------------------------------------
  # Job 3: Production Build Verification
  # ----------------------------------------------------------------------------
  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache Next.js bundle caches
        uses: actions/cache@v4
        with:
          path: |
            apps/admin/.next/cache
            apps/mobile/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @dzitoe/db prisma:generate

      - name: Build All Workspaces
        run: pnpm build
